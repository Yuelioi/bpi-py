[project]
name = "bpi-py"
version = "0.3.0"
description = "Async Bilibili API SDK for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/Yuelioi/bpi-py"
Issues = "https://github.com/Yuelioi/bpi-py/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<3", "tree-sitter>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bpi",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/migration/SOURCE-LICENSE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bpi", "tools"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bpi", "tools/migration"]
